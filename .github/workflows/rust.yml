name: Rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check validator formatting
        run: cargo fmt --manifest-path tools/numeric-validation/Cargo.toml --all -- --check
      - name: Test independent numeric validator
        run: cargo test --manifest-path tools/numeric-validation/Cargo.toml --workspace --locked
      - name: Lint independent numeric validator
        run: cargo clippy --manifest-path tools/numeric-validation/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Verify independent Schema and numeric conformance
        run: cargo run --manifest-path tools/numeric-validation/Cargo.toml --locked --
      - name: Preserve numeric verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numeric-conformance-report
          path: target/numeric-conformance-report.json
          if-no-files-found: warn
