[workspace]
resolver = "2"
members = ["crates/skysheet-score", "crates/skysheet-cli", "crates/skysheet-midi", "crates/skysheet-music", "crates/skysheet-arrange"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Evanpatchouli/sky-sheet-station"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
midly = { version = "=0.5.3", default-features = false, features = ["std", "strict"] }
num-bigint = { version = "=0.4.8", default-features = false, features = ["std"] }
num-traits = { version = "=0.2.19", default-features = false, features = ["std"] }
