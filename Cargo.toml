[workspace]
resolver = "2"
members = ["crates/skysheet-score"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Evanpatchouli/sky-sheet-station"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
