[package]
name = "skysheet-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
midly = { version = "=0.5.3", default-features = false, features = ["std", "strict"] }
basic-pitch-rs = { version = "=0.1.0", default-features = false, features = ["tract", "bundled-model"] }
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3", "wav", "pcm", "flac"] }
rubato = "=0.16.2"

[dev-dependencies]
skysheet-midi = { path = "../skysheet-midi" }
